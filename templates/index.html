<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Java Silver学習ログ</title>
</head>
<body>
    <div class="main-card">
        <header>
            <h1>Java Silver 突破トラッカー</h1>
            <div class="countdown">
                試験（{{ exam_date }}）まで あと <span>{{ days_left }}</span> 日
            </div>

            <details class="config-section">
                <summary>試験日を設定する</summary>
                <form action="/update_config" method="POST" class="inline-form">
                    <input type="date" name="exam_date" value="{{ exam_date }}" required>
                    <button type="submit" class="btn-small">更新</button>
                </form>
            </details>
        </header>

        <section class="form-section">
            <form action="/add" method="POST">
                <select name="subject" required>
                    <option value="">Java Silver 科目を選択</option>
                    <option value="Javaの基本">Javaの基本（型・変数・演算子）</option>
                    <option value="制御構造">制御構造（if・for・while）</option>
                    <option value="配列">配列の操作</option>
                    <option value="メソッド">インスタンスとメソッド（基本）</option>
                    <option value="継承">クラスの継承・インターフェース</option>
                    <option value="例外">例外処理</option>
                    <option value="ラムダ/API">ラムダ式・API（List/Map）</option>
                </select>
                <input type="number" name="hours" step="0.5" placeholder="時間 (h)" required>
                <input type="text" name="memo" placeholder="今日学んだこと（一言）">
                <button type="submit">記録する</button>
            </form>
        </section>

        <section class="log-section">
            <h2>最近の学習記録</h2>
            <ul>
                {% for log in logs %}
                <li>
                    <span class="log-date">{{ log.date }}</span>
                    <span class="log-subject">{{ log.subject }}</span>
                    <span class="log-hours">{{ log.hours }}h</span>
                    <p class="log-memo">{{ log.memo }}</p>
                </li>
                {% endfor %}
            </ul>
        </section>
    </div>
</body>
</html>
